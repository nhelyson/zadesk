  <text x="1036" y="604" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ id : text [PK]</text>
  <text x="1036" y="628" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ channel : text</text>
  <text x="1036" y="652" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ eventName : text</text>
  <text x="1036" y="676" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ emittedAt : timestamp</text>
  <line x1="1020" y1="700" x2="1400" y2="700" stroke="#CBD5E1" stroke-width="1.8"/>
  <text x="1036" y="724" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ broadcastSSE() : void</text>
