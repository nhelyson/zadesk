  <text x="556" y="628" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ conversationId : text [FK]</text>
  <text x="556" y="652" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ sharedWithUserId : text [FK]</text>
  <text x="556" y="676" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ accessLevel : ShareAccessLevel</text>
  <line x1="540" y1="700" x2="920" y2="700" stroke="#5EEAD4" stroke-width="1.8"/>
  <text x="556" y="724" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ revokeAccess() : void</text>
</g>
<g id="card-pulseevent">
  <rect x="1020" y="520" width="380" height="230" rx="8" ry="8" fill="#F8FAFC" stroke="#475569" stroke-width="2"  filter="drop-shadow(0 2px 5px rgba(0,0,0,0.06))"/>
  <text x="1210.0" y="546" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#64748B" text-anchor="middle">&#171;event&#187;</text>
  <text x="1210.0" y="570" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" fill="#1E293B" text-anchor="middle">PulseEvent</text>
