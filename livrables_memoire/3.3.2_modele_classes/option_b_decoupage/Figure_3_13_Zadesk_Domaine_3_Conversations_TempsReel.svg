  <text x="1210.0" y="106" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#14B8A6" text-anchor="middle">&#171;entity&#187;</text>
  <text x="1210.0" y="130" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" fill="#0F766E" text-anchor="middle">ConversationMessage</text>
  <line x1="1020" y1="140" x2="1400" y2="140" stroke="#5EEAD4" stroke-width="1.8"/>
  <text x="1036" y="164" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ id : text [PK]</text>
  <text x="1036" y="188" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ conversationId : text [FK]</text>
  <text x="1036" y="212" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ senderUserId : text?</text>
  <text x="1036" y="236" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ senderCustomerId : text?</text>
  <text x="1036" y="260" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ type : MessageType</text>
  <text x="1036" y="284" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ body : text</text>
  <line x1="1020" y1="308" x2="1400" y2="308" stroke="#5EEAD4" stroke-width="1.8"/>
  <text x="1036" y="332" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ markAsDelivered() : void</text>
</g>
<g id="card-conversationshare">
  <rect x="540" y="520" width="380" height="230" rx="8" ry="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"  filter="drop-shadow(0 2px 5px rgba(0,0,0,0.06))"/>
  <text x="730.0" y="546" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#14B8A6" text-anchor="middle">&#171;entity&#187;</text>
