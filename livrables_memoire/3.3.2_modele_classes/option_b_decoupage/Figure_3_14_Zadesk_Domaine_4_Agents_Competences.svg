<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 850" width="1450" height="850">
<defs>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
    </style>
    <marker id="comp-diamond" viewBox="0 0 14 14" refX="1" refY="7" markerWidth="13" markerHeight="13" orient="auto">
        <polygon points="1,7 7,2 13,7 7,12" fill="#0F172A" stroke="#0F172A" stroke-width="1"/>
    </marker>
    <marker id="aggr-diamond" viewBox="0 0 14 14" refX="1" refY="7" markerWidth="13" markerHeight="13" orient="auto">
        <polygon points="1,7 7,2 13,7 7,12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    </marker>
    <marker id="nav-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
        <polygon points="1,2 10,6 1,10" fill="#2563EB"/>
    </marker>
    <marker id="dep-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
        <polyline points="2,2 10,6 2,10" fill="none" stroke="#475569" stroke-width="2"/>
    </marker>
</defs>
<rect width="1450" height="850" fill="#FAFAFA"/>
<polyline points="440,242.5 540,252.5" fill="none" stroke="#2563EB" stroke-width="2"   />
<rect x="414.6" y="225.5" width="150.8" height="20" rx="4" ry="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="490.0" y="239.5" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">incarne (1 .. 0..*)</text>
<polyline points="730.0,425 730.0,510" fill="none" stroke="#0F172A" stroke-width="2"  marker-start="url(#comp-diamond)" />
<rect x="654.6" y="445.5" width="150.8" height="20" rx="4" ry="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="730.0" y="459.5" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">détient (1 .. 0..*)</text>
<polyline points="1210.0,310 1210.0,637.5 920,637.5" fill="none" stroke="#0F172A" stroke-width="2"  marker-start="url(#aggr-diamond)" />
<rect x="1131.0" y="451.75" width="158.0" height="20" rx="4" ry="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="1210.0" y="465.75" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">qualifie (1 .. 0..*)</text>
<polyline points="250.0,480 250.0,292.5 540,292.5" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"  marker-end="url(#dep-arrow)"/>
<rect x="189.0" y="364.25" width="122.0" height="20" rx="4" ry="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="250.0" y="378.25" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">évalue capacité</text>
<g id="card-user">
  <rect x="60" y="80" width="380" height="325" rx="8" ry="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"  filter="drop-shadow(0 2px 5px rgba(0,0,0,0.06))"/>
  <text x="250.0" y="106" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#10B981" text-anchor="middle">&#171;entity&#187;</text>
  <text x="250.0" y="130" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" fill="#047857" text-anchor="middle">User</text>
  <line x1="60" y1="140" x2="440" y2="140" stroke="#6EE7B7" stroke-width="1.8"/>
  <text x="76" y="164" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ id : text [PK]</text>
  <text x="76" y="188" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ email : text [UQ]</text>
  <text x="76" y="212" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ firstName : text</text>
  <text x="76" y="236" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ lastName : text</text>
  <text x="76" y="260" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ passwordHash : text?</text>
  <text x="76" y="284" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ emailVerified : boolean</text>
  <text x="76" y="308" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ googleId : text [UQ]?</text>
  <line x1="60" y1="332" x2="440" y2="332" stroke="#6EE7B7" stroke-width="1.8"/>
  <text x="76" y="356" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ getFullName() : text</text>
  <text x="76" y="380" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ verifyPassword() : boolean</text>
</g>
<g id="card-agentprofile">
  <rect x="540" y="80" width="380" height="345" rx="8" ry="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"  filter="drop-shadow(0 2px 5px rgba(0,0,0,0.06))"/>
  <text x="730.0" y="106" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#D97706" text-anchor="middle">&#171;entity&#187;</text>
  <text x="730.0" y="130" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" fill="#B45309" text-anchor="middle">AgentProfile</text>
  <line x1="540" y1="140" x2="920" y2="140" stroke="#FCD34D" stroke-width="1.8"/>
  <text x="556" y="164" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ id : text [PK]</text>
  <text x="556" y="188" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ userId : text [FK]</text>
  <text x="556" y="212" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ workspaceId : text [FK]</text>
  <text x="556" y="236" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ title : text = &quot;Conseiller&quot;</text>
  <text x="556" y="260" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ availability : AgentAvailability</text>
  <text x="556" y="284" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ maxCapacity : int = 10</text>
  <text x="556" y="308" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ autoAssignment : boolean</text>
  <line x1="540" y1="332" x2="920" y2="332" stroke="#FCD34D" stroke-width="1.8"/>
  <text x="556" y="356" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ setAvailability(s) : void</text>
  <text x="556" y="380" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ isAvailable() : boolean</text>
</g>
<g id="card-skill">
  <rect x="1020" y="80" width="380" height="230" rx="8" ry="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"  filter="drop-shadow(0 2px 5px rgba(0,0,0,0.06))"/>
  <text x="1210.0" y="106" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#D97706" text-anchor="middle">&#171;entity&#187;</text>
  <text x="1210.0" y="130" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" fill="#B45309" text-anchor="middle">Skill</text>
  <line x1="1020" y1="140" x2="1400" y2="140" stroke="#FCD34D" stroke-width="1.8"/>
  <text x="1036" y="164" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ id : text [PK]</text>
  <text x="1036" y="188" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ workspaceId : text [FK]</text>
  <text x="1036" y="212" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ name : text</text>
  <text x="1036" y="236" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ description : text?</text>
  <line x1="1020" y1="260" x2="1400" y2="260" stroke="#FCD34D" stroke-width="1.8"/>
  <text x="1036" y="284" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ validate() : void</text>
</g>
<g id="card-agentskill">
  <rect x="540" y="510" width="380" height="255" rx="8" ry="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"  filter="drop-shadow(0 2px 5px rgba(0,0,0,0.06))"/>
  <text x="730.0" y="536" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#D97706" text-anchor="middle">&#171;entity&#187;</text>
  <text x="730.0" y="560" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" fill="#B45309" text-anchor="middle">AgentSkill</text>
  <line x1="540" y1="570" x2="920" y2="570" stroke="#FCD34D" stroke-width="1.8"/>
  <text x="556" y="594" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ id : text [PK]</text>
  <text x="556" y="618" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ agentProfileId : text [FK]</text>
  <text x="556" y="642" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ skillId : text [FK]</text>
  <text x="556" y="666" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ validatedAt : timestamp?</text>
  <line x1="540" y1="690" x2="920" y2="690" stroke="#FCD34D" stroke-width="1.8"/>
  <text x="556" y="714" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ certify(managerId) : void</text>
</g>
<g id="card-assignmentengine">
  <rect x="60" y="480" width="380" height="240" rx="8" ry="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"  filter="drop-shadow(0 2px 5px rgba(0,0,0,0.06))"/>
  <text x="250.0" y="506" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#D97706" text-anchor="middle">&#171;service&#187;</text>
  <text x="250.0" y="530" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" fill="#B45309" text-anchor="middle">AssignmentEngine</text>
  <line x1="60" y1="540" x2="440" y2="540" stroke="#FCD34D" stroke-width="1.8"/>
  <text x="76" y="564" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">- criteria : AssignmentStrategy</text>
  <text x="76" y="588" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">- strictAvailability : boolean = true</text>
  <line x1="60" y1="612" x2="440" y2="612" stroke="#FCD34D" stroke-width="1.8"/>
  <text x="76" y="636" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ autoAssign(ticket) : AgentProfile?</text>
  <text x="76" y="660" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ calculateScore(agent, tck) : float</text>
  <text x="76" y="684" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ rebalanceWorkload(wsId) : Report</text>
</g>
</svg>