<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 800" width="1450" height="800">
<defs>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
    </style>
    <marker id="comp-diamond" viewBox="0 0 14 14" refX="1" refY="7" markerWidth="13" markerHeight="13" orient="auto">
        <polygon points="1,7 7,2 13,7 7,12" fill="#0F172A" stroke="#0F172A" stroke-width="1"/>
    </marker>
    <marker id="aggr-diamond" viewBox="0 0 14 14" refX="1" refY="7" markerWidth="13" markerHeight="13" orient="auto">
        <polygon points="1,7 7,2 13,7 7,12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    </marker>
    <marker id="nav-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
        <polygon points="1,2 10,6 1,10" fill="#2563EB"/>
    </marker>
    <marker id="dep-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
        <polyline points="2,2 10,6 2,10" fill="none" stroke="#475569" stroke-width="2"/>
    </marker>
</defs>
<rect width="1450" height="800" fill="#FAFAFA"/>
<polyline points="480,282.5 600,227.5" fill="none" stroke="#0F172A" stroke-width="2"  marker-start="url(#comp-diamond)" />
<rect x="468.2" y="233.0" width="143.6" height="20" rx="4" ry="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="540.0" y="247.0" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">génère (1 .. 0..*)</text>
<polyline points="290.0,465 290.0,587.5 600,587.5" fill="none" stroke="#0F172A" stroke-width="2"  marker-start="url(#comp-diamond)" />
<rect x="211.0" y="504.25" width="158.0" height="20" rx="4" ry="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="290.0" y="518.25" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">consigne (1 .. 0..*)</text>
<polyline points="980,227.5 1050,215.0" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"  marker-end="url(#dep-arrow)"/>
<rect x="950.4" y="199.25" width="129.2" height="20" rx="4" ry="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="1015.0" y="213.25" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">publie via Redis</text>
<g id="card-workspace">
  <rect x="100" y="100" width="380" height="365" rx="8" ry="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"  filter="drop-shadow(0 2px 5px rgba(0,0,0,0.06))"/>
  <text x="290.0" y="126" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#3B82F6" text-anchor="middle">&#171;entity&#187;</text>
  <text x="290.0" y="150" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" fill="#1D4ED8" text-anchor="middle">Workspace</text>
  <line x1="100" y1="160" x2="480" y2="160" stroke="#93C5FD" stroke-width="1.8"/>
  <text x="116" y="184" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ id : text [PK]</text>
  <text x="116" y="208" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ slug : text [UQ]</text>
  <text x="116" y="232" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ name : text</text>
  <text x="116" y="256" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ category : text</text>
  <text x="116" y="280" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ supportEmail : text?</text>
  <text x="116" y="304" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ supportPhone : text?</text>
  <text x="116" y="328" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ isPublic : boolean = true</text>
  <text x="116" y="352" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ verified : boolean = false</text>
  <line x1="100" y1="376" x2="480" y2="376" stroke="#93C5FD" stroke-width="1.8"/>
  <text x="116" y="400" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ createTicket() : Ticket</text>
  <text x="116" y="424" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ addMember() : Membership</text>
  <text x="116" y="448" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ getCapacityMetrics() : Metrics</text>
</g>
<g id="card-outboxevent">
  <rect x="600" y="100" width="380" height="255" rx="8" ry="8" fill="#F8FAFC" stroke="#475569" stroke-width="2"  filter="drop-shadow(0 2px 5px rgba(0,0,0,0.06))"/>
  <text x="790.0" y="126" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#64748B" text-anchor="middle">&#171;entity&#187;</text>
  <text x="790.0" y="150" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" fill="#1E293B" text-anchor="middle">OutboxEvent</text>
  <line x1="600" y1="160" x2="980" y2="160" stroke="#CBD5E1" stroke-width="1.8"/>
  <text x="616" y="184" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ id : text [PK]</text>
  <text x="616" y="208" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ workspaceId : text [FK]</text>
  <text x="616" y="232" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ aggregateType : text</text>
  <text x="616" y="256" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ eventType : text</text>
  <text x="616" y="280" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ processed : boolean = false</text>
  <line x1="600" y1="304" x2="980" y2="304" stroke="#CBD5E1" stroke-width="1.8"/>
  <text x="616" y="328" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ markPublished() : void</text>
</g>
<g id="card-pulseevent">
  <rect x="1050" y="100" width="380" height="230" rx="8" ry="8" fill="#F8FAFC" stroke="#475569" stroke-width="2"  filter="drop-shadow(0 2px 5px rgba(0,0,0,0.06))"/>
  <text x="1240.0" y="126" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#64748B" text-anchor="middle">&#171;event&#187;</text>
  <text x="1240.0" y="150" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" fill="#1E293B" text-anchor="middle">PulseEvent</text>
  <line x1="1050" y1="160" x2="1430" y2="160" stroke="#CBD5E1" stroke-width="1.8"/>
  <text x="1066" y="184" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ id : text [PK]</text>
  <text x="1066" y="208" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ channel : text</text>
  <text x="1066" y="232" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ eventName : text</text>
  <text x="1066" y="256" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ emittedAt : timestamp</text>
  <line x1="1050" y1="280" x2="1430" y2="280" stroke="#CBD5E1" stroke-width="1.8"/>
  <text x="1066" y="304" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ broadcastSSE() : void</text>
</g>
<g id="card-auditlog">
  <rect x="600" y="460" width="380" height="255" rx="8" ry="8" fill="#F8FAFC" stroke="#475569" stroke-width="2"  filter="drop-shadow(0 2px 5px rgba(0,0,0,0.06))"/>
  <text x="790.0" y="486" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#64748B" text-anchor="middle">&#171;entity&#187;</text>
  <text x="790.0" y="510" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" fill="#1E293B" text-anchor="middle">AuditLog</text>
  <line x1="600" y1="520" x2="980" y2="520" stroke="#CBD5E1" stroke-width="1.8"/>
  <text x="616" y="544" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ id : text [PK]</text>
  <text x="616" y="568" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ workspaceId : text [FK]</text>
  <text x="616" y="592" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ actorId : text</text>
  <text x="616" y="616" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ action : text</text>
  <text x="616" y="640" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ resource : text</text>
  <line x1="600" y1="664" x2="980" y2="664" stroke="#CBD5E1" stroke-width="1.8"/>
  <text x="616" y="688" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ exportLog() : json</text>
</g>
</svg>