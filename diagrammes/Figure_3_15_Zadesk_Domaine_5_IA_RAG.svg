  <text x="556" y="564" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">- modelName : text = &#x27;llama-3.3&#x27;</text>
  <text x="556" y="588" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">- confidenceThreshold : float = 0.75</text>
  <text x="556" y="612" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">- vectorStore : MongoDBAtlas</text>
  <line x1="540" y1="636" x2="920" y2="636" stroke="#A5B4FC" stroke-width="1.8"/>
  <text x="556" y="660" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ handleMessage(msg) : AIResponse</text>
  <text x="556" y="684" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ retrieveChunks(query) : List&lt;Chunk&gt;</text>
  <text x="556" y="708" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ shouldEscalate(conf) : boolean</text>
</g>
<g id="card-aiconfiguration">
  <rect x="60" y="520" width="380" height="230" rx="8" ry="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="7,4" filter="drop-shadow(0 2px 5px rgba(0,0,0,0.06))"/>
  <text x="250.0" y="546" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#6366F1" text-anchor="middle">&#171;entity&#187;</text>
  <text x="250.0" y="570" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" fill="#4338CA" text-anchor="middle">AiConfiguration</text>
  <line x1="60" y1="580" x2="440" y2="580" stroke="#A5B4FC" stroke-width="1.8"/>
  <text x="76" y="604" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ id : text [PK]</text>
  <text x="76" y="628" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ workspaceId : text [FK]</text>
  <text x="76" y="652" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ autonomyMode : AutonomyMode</text>
  <text x="76" y="676" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ autoEscalate : boolean = true</text>
  <line x1="60" y1="700" x2="440" y2="700" stroke="#A5B4FC" stroke-width="1.8"/>
  <text x="76" y="724" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ toggleAutonomy() : void</text>
</g>
</svg>