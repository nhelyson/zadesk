  <text x="730.0" y="106" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#6366F1" text-anchor="middle">&#171;entity&#187;</text>
  <text x="730.0" y="130" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" fill="#4338CA" text-anchor="middle">KnowledgeDocument</text>
  <line x1="540" y1="140" x2="920" y2="140" stroke="#A5B4FC" stroke-width="1.8"/>
  <text x="556" y="164" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ _id : ObjectId [PK]</text>
  <text x="556" y="188" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ workspaceId : text [Index]</text>
  <text x="556" y="212" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ title : text</text>
  <text x="556" y="236" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ category : text</text>
  <text x="556" y="260" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ status : DocumentStatus</text>
  <line x1="540" y1="284" x2="920" y2="284" stroke="#A5B4FC" stroke-width="1.8"/>
  <text x="556" y="308" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ chunkAndEmbed() : List&lt;Chunk&gt;</text>
</g>
<g id="card-knowledgechunk">
  <rect x="1020" y="80" width="380" height="255" rx="8" ry="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="7,4" filter="drop-shadow(0 2px 5px rgba(0,0,0,0.06))"/>
  <text x="1210.0" y="106" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#6366F1" text-anchor="middle">&#171;target_doc&#187;</text>
  <text x="1210.0" y="130" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" fill="#4338CA" text-anchor="middle">KnowledgeChunk</text>
  <line x1="1020" y1="140" x2="1400" y2="140" stroke="#A5B4FC" stroke-width="1.8"/>
  <text x="1036" y="164" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ _id : ObjectId [PK]</text>
  <text x="1036" y="188" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ documentId : ObjectId [FK]</text>
  <text x="1036" y="212" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ workspaceId : text [Index]</text>
  <text x="1036" y="236" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ chunkIndex : int</text>
  <text x="1036" y="260" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ embedding : float[1536]</text>
  <line x1="1020" y1="284" x2="1400" y2="284" stroke="#A5B4FC" stroke-width="1.8"/>
  <text x="1036" y="308" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ similarity(vec) : float</text>
</g>
<g id="card-aiassistantsupervisor">
  <rect x="540" y="480" width="380" height="255" rx="8" ry="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="7,4" filter="drop-shadow(0 2px 5px rgba(0,0,0,0.06))"/>
  <text x="730.0" y="506" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#6366F1" text-anchor="middle">&#171;service&#187;</text>
  <text x="730.0" y="530" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" fill="#4338CA" text-anchor="middle">AiAssistantSupervisor</text>
