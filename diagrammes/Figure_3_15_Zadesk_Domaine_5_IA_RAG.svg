<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 850" width="1450" height="850">
<defs>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
    </style>
    <marker id="comp-diamond" viewBox="0 0 14 14" refX="1" refY="7" markerWidth="13" markerHeight="13" orient="auto">
        <polygon points="1,7 7,2 13,7 7,12" fill="#0F172A" stroke="#0F172A" stroke-width="1"/>
    </marker>
    <marker id="aggr-diamond" viewBox="0 0 14 14" refX="1" refY="7" markerWidth="13" markerHeight="13" orient="auto">
        <polygon points="1,7 7,2 13,7 7,12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    </marker>
    <marker id="nav-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
        <polygon points="1,2 10,6 1,10" fill="#2563EB"/>
    </marker>
    <marker id="dep-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
        <polyline points="2,2 10,6 2,10" fill="none" stroke="#475569" stroke-width="2"/>
    </marker>
</defs>
<rect width="1450" height="850" fill="#FAFAFA"/>
<polyline points="440,262.5 540,220.0" fill="none" stroke="#0F172A" stroke-width="2"  marker-start="url(#comp-diamond)" />
<rect x="414.6" y="219.25" width="150.8" height="20" rx="4" ry="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="490.0" y="233.25" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">possède (1 .. 0..*)</text>
<polyline points="920,220.0 1020,207.5" fill="none" stroke="#0F172A" stroke-width="2"  marker-start="url(#comp-diamond)" />
<rect x="883.8" y="191.75" width="172.4" height="20" rx="4" ry="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="970.0" y="205.75" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">découpé en (1 .. 1..*)</text>
<polyline points="920,607.5 1210.0,607.5 1210.0,335" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"  marker-end="url(#dep-arrow)"/>
<rect x="986.0" y="585.5" width="158.0" height="20" rx="4" ry="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="1065.0" y="599.5" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">recherche sémantique</text>
<polyline points="440,635.0 540,607.5" fill="none" stroke="#2563EB" stroke-width="2"   />
<rect x="418.2" y="599.25" width="143.6" height="20" rx="4" ry="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="490.0" y="613.25" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">configure (1 .. 1)</text>
<polyline points="250.0,445 250.0,520" fill="none" stroke="#0F172A" stroke-width="2"  marker-start="url(#comp-diamond)" />
<rect x="178.2" y="460.5" width="143.6" height="20" rx="4" ry="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="250.0" y="474.5" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">paramètre (1 .. 1)</text>
<g id="card-workspace">
  <rect x="60" y="80" width="380" height="365" rx="8" ry="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"  filter="drop-shadow(0 2px 5px rgba(0,0,0,0.06))"/>
  <text x="250.0" y="106" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" font-style="italic" fill="#3B82F6" text-anchor="middle">&#171;entity&#187;</text>
  <text x="250.0" y="130" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" fill="#1D4ED8" text-anchor="middle">Workspace</text>
  <line x1="60" y1="140" x2="440" y2="140" stroke="#93C5FD" stroke-width="1.8"/>
  <text x="76" y="164" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ id : text [PK]</text>
  <text x="76" y="188" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ slug : text [UQ]</text>
  <text x="76" y="212" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ name : text</text>
  <text x="76" y="236" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ category : text</text>
  <text x="76" y="260" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ supportEmail : text?</text>
  <text x="76" y="284" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ supportPhone : text?</text>
  <text x="76" y="308" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ isPublic : boolean = true</text>
  <text x="76" y="332" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0F172A">+ verified : boolean = false</text>
  <line x1="60" y1="356" x2="440" y2="356" stroke="#93C5FD" stroke-width="1.8"/>
  <text x="76" y="380" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ createTicket() : Ticket</text>
  <text x="76" y="404" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ addMember() : Membership</text>
  <text x="76" y="428" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#334155">+ getCapacityMetrics() : Metrics</text>
</g>
<g id="card-knowledgedocument">
