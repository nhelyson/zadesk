<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="zGradient" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1B3D" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="emeraldGradient" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON EMBLEM (CONCEPT 05) -->
  <g transform="translate(10, 10)">
    <!-- Outer Orbit Ring -->
    <circle cx="50" cy="50" r="42" stroke="#0D1B3D" stroke-width="7" stroke-linecap="round" stroke-dasharray="210 50" />
    
    <!-- Dynamic Slash / Bottom Line -->
    <line x1="26" y1="74" x2="68" y2="32" stroke="url(#emeraldGradient)" stroke-width="7" stroke-linecap="round" />

    <!-- Z Geometric Shape Inside -->
    <path d="M34 34 H66 L38 66 H66" stroke="#0D1B3D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- AI Sparkle Star (Top Right) -->
    <g transform="translate(80, 12)" filter="url(#glow)">
      <path d="M0 8 C4 8 8 4 8 0 C8 4 12 8 16 8 C12 8 8 12 8 16 C8 12 4 8 0 8 Z" fill="#22C55E" />
    </g>
  </g>

  <!-- TEXT TYPOGRAPHY "Zadesk" -->
  <text x="135" y="70" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="52" fill="#0D1B3D" letter-spacing="-1">
    Za<tspan fill="#22C55E">desk</tspan>
  </text>

  <!-- SUBTITLE -->
  <text x="138" y="94" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#64748B" letter-spacing="2.5">
    L'IA LOCALE AU SERVICE DE VOS CLIENTS
  </text>
</svg>
